# All environment-specific values come from environment variables (see backend/.env.example).
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
  tomcat:
    max-swallow-size: 5MB

spring:
  application:
    name: fighter-os-api
  # Local secrets (JWT_SECRET…) can live in backend/.env (git-ignored).
  # Real environment variables still take precedence.
  config:
    import: optional:file:.env[.properties]
  data:
    # Defaults to localhost:27017. Override with SPRING_DATA_MONGODB_URI (e.g. MongoDB Atlas)
    # or SPRING_DATA_MONGODB_HOST / SPRING_DATA_MONGODB_PORT.
    mongodb:
      database: ${MONGODB_DATABASE:ajp_fighter_os}
      auto-index-creation: true
  servlet:
    multipart:
      enabled: false
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Base64 secret of at least 256 bits. If empty, a random one is generated at startup
    # (sessions are then invalidated on restart) — acceptable only for local development.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  limits:
    max-entities-per-collection: ${MAX_ENTITIES_PER_COLLECTION:20000}
    max-entity-bytes: ${MAX_ENTITY_BYTES:262144}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.ajp.fighteros: INFO
